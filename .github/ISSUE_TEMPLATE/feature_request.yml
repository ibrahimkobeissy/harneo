name: Feature request
description: Suggest an idea for Harneo.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening one, check [CONTEXT.md](https://github.com/ibrahimkobeissy/harneo/blob/main/CONTEXT.md): it lists what Harneo deliberately does not do.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you'd like Harneo to help. Alternatives you considered are welcome too.
    validations:
      required: true

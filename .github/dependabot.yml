# Dependabot version updates (#210). Tuned to keep Actions usage and PR noise low:
# monthly runs, one grouped PR per ecosystem, a small PR limit, and a cooldown so
# brand-new releases settle before they are proposed. Security updates are on in the
# repo settings and are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # The workspace root Cargo.toml covers every crate and src-tauri.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

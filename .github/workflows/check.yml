name: check

on:
  push:
  pull_request:

jobs:
  check-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # check:fast and check:task diff against main; make sure the ref exists.
      - name: Ensure a local main ref
        run: git rev-parse --verify main >/dev/null 2>&1 || git branch main origin/main

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,gitleaks,osv-scanner

      - name: Install semgrep and diff-cover
        run: pip install semgrep diff-cover

      - run: npm run check:full

[workspace]
members = ["crates/harneo-core", "crates/harneo-cli", "crates/harneo-report", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ibrahimkobeissy/harneo"

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov builds with `--cfg coverage` (test performance budgets read it).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# SQLite is C code compiled by libsqlite3-sys: unoptimised, a library query is several times
# slower in debug and test builds, and the 2,000-artifact speed test measures the engine, not the
# build profile.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[package]
name = "harneo-cli"
description = "The harneo command: argument parsing and printing over harneo-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "harneo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
harneo-core = { path = "../harneo-core" }
serde = "1.0.229"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
harneo-core = { path = "../harneo-core" }
predicates = "3.1.4"
tempfile = "3.27.0"

[package]
name = "harneo-report"
description = "Optional Sentry error reporting for the app and the CLI: opt-in gate and scrubbing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
harneo-core = { path = "../harneo-core" }
regex = "1.13.1"
sentry = { version = "=0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde_json = "1.0.154"
dirs = "7.0.0"

[lints]
workspace = true

[dev-dependencies]
sentry = { version = "=0.49.5", default-features = false, features = ["test"] }

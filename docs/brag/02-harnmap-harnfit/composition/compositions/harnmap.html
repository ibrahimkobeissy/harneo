  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // camera framing: a stage point P shows at P * scale + (x, y)
      const FULL = { x: 0, y: 0, scale: 1 };
      const LINE_A = { x: -560, y: -560, scale: 2 }; // Idea, Spec, Plan, Build, Test

      tl.set("#hm-cam", FULL, 0);
      tl.fromTo(
        "#hm-win",
        { y: 260, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" },
        0,
      );
      tl.fromTo(
        "#hm-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        0.1,
      );
      tl.fromTo(
        "#hm-cap1",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        0.2,
      );
      // fly along the line: into the first stages, then across to Review, Ship and the loops
      tl.to("#hm-band", { opacity: 1, duration: 0.4 }, 1.0);
      tl.to("#hm-cam", { ...LINE_A, duration: 0.8, ease: "power2.inOut" }, 1.0);
      tl.to("#hm-cam", { ...LINE_B, duration: 1.7, ease: "sine.inOut" }, 1.9);
      tl.to(
        "#hm-cap1",
        { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power3.in" },
        3.5,
      );
      // pull back to the whole window for the click
      tl.to("#hm-cam", { ...FULL, duration: 0.6, ease: "power3.inOut" }, 3.65);
      tl.to("#hm-band", { opacity: 0, duration: 0.3 }, 3.8);
      // cursor travels to the review node; beat-locked click at film 14.00 s (local 5.0)
      tl.fromTo(
        "#hm-cursor",
        { x: 1500, y: 1000, opacity: 0 },
        { opacity: 1, duration: 0.15 },
        4.2,
      );
      tl.to(
        "#hm-cursor",
        { x: 1030, y: 530, duration: 0.7, ease: "power2.inOut" },
        4.25,
      );
      tl.to(
        "#hm-cursor",
        { scale: 0.86, duration: 0.05, ease: "power2.out" },
        5.0,
      );
      tl.to(
        "#hm-cursor",
        { scale: 1, duration: 0.08, ease: "power2.out" },
        5.05,
      );
      // the click is a cut: the node opens with Claude's reading and next steps 1-2-3
      tl.fromTo(
        "#hm-after",
        { opacity: 0 },
        { opacity: 1, duration: 0.034, ease: "none" },
        5.0,
      );
      tl.to("#hm-cursor", { opacity: 0, duration: 0.2 }, 5.2);
      // zoom in on the selection and the side panel
      tl.to("#hm-cam", { ...NODE, duration: 0.9, ease: "power2.inOut" }, 5.15);
      tl.to("#hm-band", { opacity: 1, duration: 0.4 }, 5.3);
      tl.fromTo(
        "#hm-cap2",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        5.3,
      );
      tl.to(
        "#hm-stage > *",
        { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" },

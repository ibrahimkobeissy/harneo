  <script>
    (function () {
      // Real artifact names from public packs in the captured library (texture, not read).
      const names = [
        "/plugin install agent-skills",
        "spec-driven-development",
        "/ship",
        "code-review",
        "tdd",
        "handoff",
        "/build auto",
        "security-auditor",
        "grill-me",
        "/review",
        "context-engineering",
        "mattpocock/skills",
        "interview-me",
        "code-reviewer",
        "incremental-implementation",
        "addyosmani/agent-skills",
        "/plan",
        "pr",
        "browser-testing-with-devtools",
        "doubt-driven-development",
        "/code-simplify",
        "test-engineer",
        "shipping-and-launch",
        "wayfinder",
        "web-performance-auditor",
        "debugging-and-error-recovery",
        "codebase-design",
        "/spec",
        "idea-refine",
        "git-workflow-and-versioning",
        "constraint-driven-development",
        "/webperf",
      ];
      const rows = document.getElementById("hk-rows");
      const N = 9;
      for (let r = 0; r < N; r++) {
        const row = document.createElement("div");
        row.className = "hk-row";
        row.id = "hk-row-" + r;
        row.style.top = 18 + r * 118 + "px";
        let html = "";
        for (let k = 0; k < 14; k++) {
          const n = names[(r * 5 + k * 3) % names.length];
          html +=
            '<span class="hk-chip" data-layout-ignore>' +
            (n.startsWith("/") ? "<b>" + n + "</b>" : n) +
            "</span>";
        }
        row.innerHTML = html;
        rows.appendChild(row);
      }
      const tl = gsap.timeline({ paused: true });
      // rows drift in opposite directions at different speeds; pure function of time
      for (let r = 0; r < N; r++) {
        const dir = r % 2 ? 1 : -1;
        const from = dir > 0 ? -900 : -200;
        tl.fromTo(
          "#hk-row-" + r,
          { x: from, opacity: 1 },
          {
            x: from + dir * (380 + (r % 3) * 160),
            opacity: 1,
            duration: 3.5,
            ease: "none",
          },
          0,
        );
        tl.to("#hk-row-" + r, { opacity: 0.0001, duration: 0.01 }, 3.49);
      }
      tl.set("#hk-veil", { opacity: 1 }, 0);
      // line 1 is on screen from frame 0 (the thumbnail), settling in place
      tl.fromTo(
        "#hk-l1",
        { y: 10 },
        { y: 0, duration: 0.4, ease: "expo.out" },
        0,
      );
      tl.fromTo(
        "#hk-l2",
        { opacity: 0, y: 24, filter: "blur(8px)" },
        {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          duration: 0.3,
          ease: "expo.out",
        },
        1.4,
      );
      // exit: lines and chips lift away; the tree types in next
      tl.to(
        ["#hk-l1", "#hk-l2", "#hk-rows"],
        {
          opacity: 0,
          filter: "blur(10px)",
          duration: 0.22,
          ease: "power3.in",
          stagger: 0.03,
        },
        3.22,
      );
      window.__timelines["hook"] = tl;
    })();

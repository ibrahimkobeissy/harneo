<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#f8fafc"},
    {"id":"color-ink","type":"color","label":"Text","default":"#0f172a"},
    {"id":"color-muted","type":"color","label":"Muted text","default":"#475569"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#2563eb"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Harneo brag: Harnmap and Harnfit</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- per-frame RMS of the music (30 fps), for the audio-reactive logo glow -->
    <script src="assets/music/harneo-theme.rms.js"></script>
    <style>
      :root {
        --color-ground: #f8fafc;
        --color-ink: #0f172a;
        --color-muted: #475569;
        --color-accent: #2563eb;
        --font-display: Inter;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display), sans-serif;
      }
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            1100px 700px at 78% 108%,
            rgba(37, 99, 235, 0.16),
            transparent 70%
          ),
          radial-gradient(
            900px 600px at 8% -10%,
            rgba(37, 99, 235, 0.08),
            transparent 70%
          ),
          var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="ground"
        class="clip"
        data-start="0"
        data-duration="32"
        data-track-index="0"
      ></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="before"
        data-composition-id="before"
        data-composition-src="compositions/before.html"
        data-start="3.5"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="reveal"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="6"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="harnmap"
        data-composition-id="harnmap"
        data-composition-src="compositions/harnmap.html"
        data-start="9"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="harnfit"
        data-composition-id="harnfit"
        data-composition-src="compositions/harnfit.html"
        data-start="17"
        data-duration="11"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="28"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music: original composition (../music/compose.py), beats every 0.5 s -->
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="32"
        data-track-index="2"
        data-volume="0.9"
        src="assets/music/harneo-theme.wav"
      ></audio>

      <!-- SFX (CC0, Kenney): key ticks as the tree types, card slides as windows arrive,
           clicks on the node and the verdict cuts, impacts on both logos; all on the beat grid -->
      <audio
        id="sfx-key-1"
        class="clip"
        data-start="3.75"
        data-duration="0.14"
        data-track-index="3"
        data-volume="0.2"
        src="assets/sfx/keypress-003.wav"
      ></audio>
      <audio
        id="sfx-key-2"
        class="clip"
        data-start="4"
        data-duration="0.14"
        data-track-index="3"
        data-volume="0.2"
        src="assets/sfx/keypress-007.wav"
      ></audio>
      <audio
        id="sfx-key-3"
        class="clip"
        data-start="4.25"
        data-duration="0.14"
        data-track-index="3"
        data-volume="0.2"
        src="assets/sfx/keypress-012.wav"
      ></audio>
      <audio
        id="sfx-key-4"
        class="clip"
        data-start="4.5"
        data-duration="0.14"
        data-track-index="3"
        data-volume="0.2"
        src="assets/sfx/keypress-018.wav"
      ></audio>
      <audio
        id="sfx-flag"
        class="clip"
        data-start="5"
        data-duration="0.05"
        data-track-index="3"
        data-volume="0.3"
        src="assets/sfx/click2.wav"
      ></audio>
      <audio
        id="sfx-reveal"
        class="clip"
        data-start="6"
        data-duration="0.14"
        data-track-index="3"
        data-volume="0.45"
        src="assets/sfx/impactSoft_medium_004.wav"
      ></audio>
      <audio
        id="sfx-card-map"
        class="clip"
        data-start="9"
        data-duration="0.6"
        data-track-index="3"
        data-volume="0.3"
        src="assets/sfx/card-slide-1.wav"
      ></audio>
      <audio
        id="sfx-node"
        class="clip"
        data-start="14"
        data-duration="0.05"
        data-track-index="3"
        data-volume="0.42"
        src="assets/sfx/click2.wav"
      ></audio>
      <audio
        id="sfx-card-fit"
        class="clip"
        data-start="17"
        data-duration="0.6"
        data-track-index="3"
        data-volume="0.3"
        src="assets/sfx/card-slide-1.wav"
      ></audio>
      <audio
        id="sfx-cut-2"
        class="clip"
        data-start="20"
        data-duration="0.05"
        data-track-index="3"
        data-volume="0.3"
        src="assets/sfx/click2.wav"
      ></audio>
      <audio
        id="sfx-cut-3"
        class="clip"
        data-start="23"
        data-duration="0.05"
        data-track-index="3"
        data-volume="0.34"
        src="assets/sfx/click2.wav"
      ></audio>
      <audio
        id="sfx-logo"
        class="clip"
        data-start="28"
        data-duration="0.18"
        data-track-index="3"
        data-volume="0.5"
        src="assets/sfx/impactSoft_medium_001.wav"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

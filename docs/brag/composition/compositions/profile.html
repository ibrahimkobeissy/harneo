  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const WIN = { x: 240, y: 200 };
      const BTN = { x: 262, y: 42 }; // "Add" button inside a card
      const cards = [
        [279, 358],
        [598, 358],
        [279, 452],
        [598, 452],
        [279, 546],
        [598, 546],
        [279, 641],
        [598, 641],
      ];
      tl.fromTo(
        "#pf-win",
        { y: 40, opacity: 0, filter: "blur(8px)" },
        {
          y: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.45,
          ease: "expo.out",
        },
        0,
      );
      tl.fromTo(
        "#pf-eyebrow",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        0.1,
      );
      tl.fromTo(
        "#pf-cap",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        0.15,
      );
      // cursor enters from the lower right, then clicks each Add on the beat grid (11.50 + 0.25 n)
      tl.fromTo(
        "#pf-cursor",
        { x: 1180, y: 900, opacity: 0 },
        { opacity: 1, duration: 0.15 },
        0.2,
      );
      cards.forEach(function (c, i) {
        const t = 0.5 + i * 0.25; // beat-grid
        const tx = WIN.x + c[0] + BTN.x;
        const ty = WIN.y + c[1] + BTN.y;
        tl.to(
          "#pf-cursor",
          {
            x: tx,
            y: ty,
            duration: i === 0 ? 0.28 : 0.17,
            ease: "power2.inOut",
          },
          t - (i === 0 ? 0.28 : 0.17),
        );
        tl.to(
          "#pf-cursor",
          { scale: 0.86, duration: 0.05, ease: "power2.out" },
          t,
        );
        tl.to(
          "#pf-cursor",
          { scale: 1, duration: 0.08, ease: "power2.out" },
          t + 0.05,
        );
        tl.fromTo(
          "#pf-c" + (i + 1),
          { opacity: 0 },
          { opacity: 1, duration: 0.08, ease: "none" },
          t + 0.02,
        );
      });
      tl.to("#pf-cursor", { opacity: 0, duration: 0.15 }, 2.4);
      // 13.5 s film: the saved state (title "Heavy", 11 files, "Saved Heavy v1")
      tl.fromTo(
        "#pf-saved",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.inOut" },
        2.5,
      );
      tl.to(
        "#pf-stage > *",
        { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" },
        2.82,
      );
      window.__timelines["profile"] = tl;
    })();
  </script>

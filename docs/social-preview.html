<!doctype html>
<!--
  Source of docs/social-preview.png, the 1280×640 card GitHub shows when the repo is shared.
  Render it again after a change:
    google-chrome-stable --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --screenshot=docs/social-preview.png docs/social-preview.html
  Then upload it in the repo's Settings → General → Social preview.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harneo social preview</title>
    <style>
      @font-face {
        font-family: Inter;
        font-weight: 400;
        src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2);
      }
      @font-face {
        font-family: Inter;
        font-weight: 500;
        src: url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2);
      }
      @font-face {
        font-family: Inter;
        font-weight: 600;
        src: url(../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2);
      }
      @font-face {
        font-family: Inter;
        font-weight: 700;
        src: url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2);
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        font-family: Inter, sans-serif;
        color: #0f172a;
        background:
          radial-gradient(
            900px 500px at 105% 110%,
            #dbeafe 0%,
            transparent 60%
          ),
          linear-gradient(#f8fafc, #ffffff);
        position: relative;
      }
      /* faint grid, like a canvas */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#e2e8f0 1px, transparent 1px),
          linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.55),
          transparent 55%
        );
        opacity: 0.6;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 72px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand svg {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28);
      }
      .brand h1 {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      .pitch {
        margin-top: 36px;
        font-size: 40px;
        line-height: 1.12;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .pitch em {
        font-style: normal;
        color: #2563eb;
      }
      .sub {
        margin-top: 20px;
        font-size: 21px;
        line-height: 1.45;
        color: #475569;
      }
      .chips {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        color: #334155;
        padding: 5px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
      .foot {
        position: absolute;
        left: 72px;
        bottom: 52px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-weight: 500;
        color: #64748b;
      }
      .foot b {
        color: #0f172a;
        font-weight: 500;
      }
      .shot {
        position: absolute;
        left: 650px;
        top: 92px;
        width: 840px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.06),
          0 30px 60px -12px rgba(15, 23, 42, 0.25);
      }
      .bar {
        height: 30px;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        gap: 7px;
        align-items: center;
        padding-left: 12px;
      }
      .bar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #cbd5e1;
      }
      .shot img {
        display: block;
        width: 840px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#2563EB" />
          <path
            d="M7 6v12M17 6v12"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <path
            d="M7 12h4.2"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <circle cx="14" cy="12" r="2.1" fill="#fff" />
        </svg>
        <h1>Harneo</h1>
      </div>
      <p class="pitch">The harness manager<br />for <em>Claude Code</em>.</p>
      <p class="sub">
        Keep every skill, subagent, setting and MCP server in one audited
        library. Ship it into any project as a profile, every write previewed
        and backed up.
      </p>
      <div class="chips">
        <span class="chip">library</span>
        <span class="chip">profiles</span>
        <span class="chip">scaffold</span>
        <span class="chip">refit</span>
        <span class="chip">audit</span>
        <span class="chip">drift</span>
      </div>
    </div>
    <p class="foot">
      <b>github.com/ibrahimkobeissy/harneo</b> · open source · MIT
    </p>
    <div class="shot">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="screenshots/library.png" alt="" />
    </div>
  </body>
</html>

[package]
name = "harneo-app"
description = "Harneo desktop app: Tauri setup and thin IPC commands over harneo-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The _lib suffix keeps the library name from colliding with the binary on Windows.
name = "harneo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "harneo-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harneo-core = { path = "../crates/harneo-core" }
harneo-report = { path = "../crates/harneo-report" }
sentry = { version = "=0.49.3", default-features = false }
ts-rs = "12.0.1"
tauri-plugin-opener = "2.7.2"
getrandom = "0.4"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27.0"

[lints]
workspace = true
